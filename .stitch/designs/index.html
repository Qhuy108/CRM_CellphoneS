<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    :root {
      --cps-red: #D70018;
      --cps-red-dark: #B30012;
      --cps-gold: #F59E0B;
      --cps-green: #10B981;
      --cps-dark: #111827;
      --cps-dark-secondary: #1F2937;
      --cps-border: #374151;
      --cps-light-bg: #F8FAFC;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: var(--cps-dark);
      color: #F3F4F6;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    /* Top Portal Header */
    .portal-header {
      background-color: var(--cps-dark);
      border-bottom: 1px solid var(--cps-border);
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 50;
      gap: 16px;
    }
    .brand-section {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-badge {
      background: linear-gradient(135deg, var(--cps-red), var(--cps-red-dark));
      color: white;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 14px;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(215, 0, 24, 0.35);
    }
    .project-title {
      font-size: 14px;
      font-weight: 600;
      color: #E5E7EB;
    }
    .project-subtitle {
      font-size: 11px;
      color: #9CA3AF;
    }
    /* Screen Tabs */
    .screens-nav {
      display: flex;
      align-items: center;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0;
    }
    .screen-tab {
      background-color: var(--cps-dark-secondary);
      border: 1px solid var(--cps-border);
      color: #D1D5DB;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    .screen-tab:hover {
      background-color: #374151;
      color: #FFFFFF;
      border-color: #4B5563;
    }
    .screen-tab.active {
      background-color: var(--cps-red);
      color: #FFFFFF;
      border-color: var(--cps-red-dark);
      box-shadow: 0 2px 8px rgba(215, 0, 24, 0.4);
      font-weight: 600;
    }
    .tab-num {
      background: rgba(0,0,0,0.25);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
    }
    /* Toolbar Right */
    .portal-tools {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .tool-btn {
      background-color: var(--cps-dark-secondary);
      border: 1px solid var(--cps-border);
      color: #D1D5DB;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      text-decoration: none;
    }
    .tool-btn:hover {
      background-color: #374151;
      color: white;
    }
    .tool-btn.primary {
      background-color: var(--cps-red);
      border-color: var(--cps-red);
      color: white;
    }
    /* Workspace Area */
    .workspace-wrapper {
      flex: 1;
      display: flex;
      position: relative;
      background-color: #0F172A;
      overflow: hidden;
    }
    .preview-container {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: #1E293B;
      padding: 0;
      position: relative;
    }
    .preview-iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: white;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    /* Spec Drawer */
    .spec-drawer {
      width: 400px;
      background-color: var(--cps-dark-secondary);
      border-left: 1px solid var(--cps-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      transition: transform 0.3s ease, margin-right 0.3s ease;
      z-index: 40;
    }
    .spec-drawer.collapsed {
      margin-right: -400px;
    }
    .drawer-header {
      padding: 16px;
      border-bottom: 1px solid var(--cps-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .drawer-title {
      font-size: 14px;
      font-weight: 700;
      color: #F9FAFB;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .close-drawer-btn {
      background: transparent;
      border: none;
      color: #9CA3AF;
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .close-drawer-btn:hover {
      background-color: #374151;
      color: white;
    }
    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    .spec-card {
      background-color: var(--cps-dark);
      border: 1px solid var(--cps-border);
      border-radius: 8px;
      padding: 14px;
    }
    .spec-card h4 {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--cps-gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spec-card ul {
      padding-left: 18px;
      color: #D1D5DB;
    }
    .spec-card li {
      margin-bottom: 6px;
    }
    .spec-badge {
      display: inline-block;
      background-color: #374151;
      color: #93C5FD;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
    }
    /* Responsive viewport selector */
    .viewport-selector {
      display: flex;
      background-color: var(--cps-dark);
      border: 1px solid var(--cps-border);
      border-radius: 6px;
      padding: 2px;
    }
    .viewport-btn {
      background: transparent;
      border: none;
      color: #9CA3AF;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .viewport-btn:hover {
      color: white;
    }
    .viewport-btn.active {
      background-color: #374151;
      color: white;
      font-weight: 600;
    }
  </style>
</head>

        doctype: "CSKH Analytics Dashboard (Frappe Workspace Analytics)",
        useCase: "Giám sát thời gian thực các chỉ số KPI theo Mục 5.1 BA (Tỷ lệ thắng cơ hội, Khách hàng mới, Tổng ticket giải quyết, Ca nhắc việc quá hạn 3 ngày) và biểu đồ phân bổ kết quả.",
        views: [

        ],
        validations: [
          "Lỗi chọn khoảng ngày: Ngày bắt đầu không được lớn hơn Ngày kết thúc trong bộ lọc thời gian!",
          "Chưa có dữ liệu: Chưa phát sinh cơ hội đóng trong kỳ để tính tỷ lệ thắng (Mẫu số = 0)."

      }
    ];

    let currentScreenIndex = 0;

    function loadScreen(index) {
      currentScreenIndex = index;
      const screen = screensData[index];

      // Update active tab styling
      const tabs = document.querySelectorAll('.screen-tab');
      tabs.forEach((tab, i) => {
        if (i === index) {
          tab.classList.add('active');
        } else {
          tab.classList.remove('active');
        }
      });

      // Update iframe source
      document.getElementById('previewIframe').src = screen.file;
      document.getElementById('openDirectBtn').href = screen.file;

      // Update drawer specifications
      updateDrawerContent(screen);
    }

    function updateDrawerContent(screen) {
      document.getElementById('drawerTitle').innerHTML = `📋 Đặc tả: ${screen.id}`;
      
      let html = `
        <div class="spec-card">
          <h4>📌 THÔNG TIN MÀN HÌNH (D03)</h4>
          <p style="font-weight: 600; color: #FFFFFF; margin-bottom: 4px;">${screen.title}</p>
          <p style="margin-bottom: 8px;"><span class="spec-badge">${screen.doctype}</span></p>
          <p style="color: #9CA3AF; font-size: 12px;">${screen.useCase}</p>
        </div>

        <div class="spec-card">
          <h4>👁️ 1. THÔNG TIN HIỂN THỊ (XEM)</h4>
          <ul>
            ${screen.views.map(v => `<li>${v}</li>`).join('')}
          </ul>
        </div>

        <div class="spec-card">
          <h4>⚡ 2. HÀNH ĐỘNG CHÍNH (ACTIONS)</h4>
          <ul>
            ${screen.actions.map(a => `<li><span style="color:#60A5FA; font-weight:500;">${a}</span></li>`).join('')}
          </ul>
        </div>

        <div class="spec-card">
          <h4>⚠️ 3. RÀNG BUỘC & CẢNH BÁO LỖI (ALERTS)</h4>
          <ul>
            ${screen.validations.map(val => `<li style="color:#FCA5A5;">${val}</li>`).join('')}
          </ul>
        </div>
      `;
      document.getElementById('drawerContent').innerHTML = html;
    }

    function toggleDrawer() {
      const drawer = document.getElementById('specDrawer');
      const btn = document.getElementById('drawerToggleBtn');
      drawer.classList.toggle('collapsed');
      if (drawer.classList.contains('collapsed')) {
        btn.style.backgroundColor = 'var(--cps-dark-secondary)';
      } else {
        btn.style.backgroundColor = 'var(--cps-red)';
      }
    }

    function setViewport(width, btn) {
      const iframe = document.getElementById('previewIframe');
      iframe.style.maxWidth = width;
      if (width === '100%') {
        iframe.style.boxShadow = 'none';
      } else {
        iframe.style.boxShadow = '0 10px 30px rgba(0,0,0,0.5)';
      }

      document.querySelectorAll('.viewport-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    // Initialize first screen
    loadScreen(0);
  </script>
</body>
</html>
